<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: black;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        #matrix {
            z-index: 1;
        }
        #textCanvas {
            z-index: 2;
        }
    </style>
</head>
<body>
<canvas id="matrix"></canvas>
<canvas id="textCanvas"></canvas>

<script>
    // 数字雨配置
    const matrixConfig = {
        fontSize: 24,
        fontColor: "#0F0",
        symbols: "Hello World!",
        speed: 0.5
    };

    // 文字配置
    const textConfig = {
        contents: ["2025.05.01", "用个特别方式", "祝大家劳动节","玩的开心哟","♪٩(´ω`)و♪"],
        fontSize: 100,
        fontColor: "black",
        strokeColor: "#0F0",
        maxStrokeWidth: 8,
        minStrokeWidth: 0,
        scaleDuration: 800,
        displayDuration: 2000,
        finalScale: 1.5,          // 最终放大比例
        finalColor: "#0F0",       // 最终颜色
        finalDuration: 3000       // 最终动画持续时间
    };

    // 初始化canvas
    const matrixCanvas = document.getElementById('matrix');
    const textCanvas = document.getElementById('textCanvas');
    const mtx = matrixCanvas.getContext('2d');
    const ctx = textCanvas.getContext('2d');
    
    function initCanvas() {
        matrixCanvas.width = window.innerWidth;
        matrixCanvas.height = window.innerHeight;
        textCanvas.width = window.innerWidth;
        textCanvas.height = window.innerHeight;
    }
    initCanvas();

    // 数字雨逻辑
    const columns = Math.floor(matrixCanvas.width / matrixConfig.fontSize);
    const drops = new Array(columns).fill(1);

    function drawMatrix() {
        mtx.fillStyle = "rgba(0, 0, 0, 0.05)";
        mtx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
        
        mtx.fillStyle = matrixConfig.fontColor;
        mtx.font = `${matrixConfig.fontSize}px monospace`;

        drops.forEach((drop, i) => {
            const symbol = matrixConfig.symbols[Math.floor(Math.random() * matrixConfig.symbols.length)];
            const x = i * matrixConfig.fontSize;
            const y = drop * matrixConfig.fontSize;

            mtx.fillText(symbol, x, y);
            
            if (y > matrixCanvas.height && Math.random() > 0.975) {
                drops[i] = 0;
            }
            drops[i] += matrixConfig.speed;
        });
    }

    // 文字动画逻辑
    let currentIndex = 0;
    let startTime = 0;
    let currentScale = 0.3;
    let currentStroke = textConfig.maxStrokeWidth;
    let isFinalAnimation = false;
    let finalStartTime = 0;

    // 颜色渐变计算
    function lerpColor(a, b, t) {
        const ar = parseInt(a.substr(1,2), 16),
              ag = parseInt(a.substr(3,2), 16),
              ab = parseInt(a.substr(5,2), 16);
        const br = parseInt(b.substr(1,2), 16),
              bg = parseInt(b.substr(3,2), 16),
              bb = parseInt(b.substr(5,2), 16);
        
        const rr = ar + (br - ar) * t,
              rg = ag + (bg - ag) * t,
              rb = ab + (bb - ab) * t;

        return `rgb(${Math.round(rr)},${Math.round(rg)},${Math.round(rb)})`;
    }

    function drawText() {
        const now = performance.now();
        ctx.clearRect(0, 0, textCanvas.width, textCanvas.height);

        // 最终文字特殊动画
        if (isFinalAnimation) {
            const finalProgress = Math.min((now - finalStartTime) / textConfig.finalDuration, 1);
            
            ctx.save();
            ctx.translate(textCanvas.width/2, textCanvas.height/2);
            
            // 持续放大效果
            const scale = 1 + (textConfig.finalScale - 1) * finalProgress;
            ctx.scale(scale, scale);
            
            // 颜色渐变
            const fillColor = lerpColor("#00FF00", "#FFFFFF", finalProgress);
            
            ctx.font = `bold ${textConfig.fontSize}px Arial`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            
            // 绘制文字
            ctx.fillStyle = fillColor;
            ctx.fillText(textConfig.contents[currentIndex], 0, 0);
            
            ctx.restore();
            return;
        }

        // 正常文字动画
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / textConfig.displayDuration, 1);

        // 计算常规动画参数
        if (elapsed < textConfig.scaleDuration) {
            currentScale = 0.3 + (0.7 * (elapsed / textConfig.scaleDuration));
        } else {
            currentScale = 1;
        }
        currentStroke = textConfig.maxStrokeWidth - 
                      (textConfig.maxStrokeWidth - textConfig.minStrokeWidth) * progress;

        ctx.save();
        ctx.translate(textCanvas.width/2, textCanvas.height/2);
        ctx.scale(currentScale, currentScale);
        
        ctx.font = `bold ${textConfig.fontSize}px Arial`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        
        // 绘制描边
        ctx.strokeStyle = textConfig.strokeColor;
        ctx.lineWidth = currentStroke;
        ctx.strokeText(textConfig.contents[currentIndex], 0, 0);
        
        // 填充文字
        ctx.fillStyle = textConfig.fontColor;
        ctx.fillText(textConfig.contents[currentIndex], 0, 0);
        
        ctx.restore();
    }

    // 文本切换逻辑
    function updateText() {
        const now = performance.now();
        if (isFinalAnimation) return;

        if (now - startTime > textConfig.displayDuration) {
            if (currentIndex < textConfig.contents.length - 1) {
                currentIndex++;
                startTime = now;
                currentScale = 0.3;
                currentStroke = textConfig.maxStrokeWidth;
            } else {
                // 触发最终动画
                isFinalAnimation = true;
                finalStartTime = now;
            }
        }
        requestAnimationFrame(updateText);
    }

    // 动画循环
    function animate() {
        drawMatrix();
        drawText();
        requestAnimationFrame(animate);
    }

    // 窗口调整
    window.addEventListener('resize', initCanvas);

    // 启动动画
    startTime = performance.now();
    requestAnimationFrame(updateText);
    animate();
</script>
</body>
</html>
