<!DOCTYPE html>
<html>
<head>
    <title>数字雨祝福语</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: black;
        }
        canvas {
            position: fixed;
            top: 0;
            left: 0;
        }
        #matrix { z-index: 1; }
        #textCanvas { z-index: 2; }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>
    <canvas id="textCanvas"></canvas>

    <script>
        /************** 配置参数 **************/
        const CONFIG = {
            // 数字雨参数
            matrix: {
                fontSize: 14,
                fadeAlpha: 0.05,
                chars: '0123456789',
                color: '#0F0'
            },

            // 文字参数
            text: {
                messages: [
                    { text: "2024", duration: 3000, fontSize: 80 },
                    { text: "前 程 似 锦", duration: 4000, fontSize: 50 },
                    { text: "代 码 永 存", duration: 4000, fontSize: 50 }
                ],
                color: '#0F0',
                fontFamily: 'sans-serif'
            }
        };

        /************** 系统变量 **************/
        let matrixCanvas, matrixCtx;
        let textCanvas, textCtx;
        let currentMessageIndex = 0;

        /************** 数字雨背景 **************/
        function initMatrix() {
            matrixCanvas = document.getElementById('matrix');
            ctx = matrixCanvas.getContext('2d');
            
            matrixCanvas.width = window.innerWidth;
            matrixCanvas.height = window.innerHeight;

            const cols = matrixCanvas.width / CONFIG.matrix.fontSize;
            const drops = new Array(Math.floor(cols)).fill(1);

            function draw() {
                ctx.fillStyle = `rgba(0, 0, 0, ${CONFIG.matrix.fadeAlpha})`;
                ctx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
                
                ctx.fillStyle = CONFIG.matrix.color;
                ctx.font = `${CONFIG.matrix.fontSize}px monospace`;

                drops.forEach((drop, i) => {
                    const char = CONFIG.matrix.chars[Math.floor(Math.random()*CONFIG.matrix.chars.length)];
                    ctx.fillText(char, i * CONFIG.matrix.fontSize, drop * CONFIG.matrix.fontSize);
                    
                    if (drop * CONFIG.matrix.fontSize > matrixCanvas.height * 1.2 && Math.random() > 0.975) {
                        drops[i] = 0;
                    }
                    drops[i]++;
                });

                requestAnimationFrame(draw);
            }
            draw();
        }
        
        /************** 文字显示系统 **************/
        function drawText(text, fontSize) {
            textCtx.clearRect(0, 0, textCanvas.width, textCanvas.height);
            textCtx.fillStyle = CONFIG.text.color;
            textCtx.font = `${fontSize}px ${CONFIG.text.fontFamily}`;
            
            // 计算居中位置
            const metrics = textCtx.measureText(text);
            const x = textCanvas.width/2 - metrics.width/2;
            const y = textCanvas.height/2 + fontSize/3;
            
            textCtx.fillText(text, x, y);
        }

        /************** 祝福语控制 **************/
        function showNextMessage() {
            const message = CONFIG.text.messages[currentMessageIndex];
            drawText(message.text, message.fontSize);
            
            setTimeout(() => {
                currentMessageIndex = (currentMessageIndex + 1) % CONFIG.text.messages.length;
                showNextMessage();
            }, message.duration);
        }

        /************** 初始化 **************/
        function init() {
            // 初始化文字画布
            textCanvas = document.getElementById('textCanvas');
            textCtx = textCanvas.getContext('2d');
            textCanvas.width = window.innerWidth;
            textCanvas.height = window.innerHeight;

            // 启动系统
            initMatrix();
            showNextMessage();

            // 窗口调整处理
            window.addEventListener('resize', () => {
                matrixCanvas.width = window.innerWidth;
                matrixCanvas.height = window.innerHeight;
                textCanvas.width = window.innerWidth;
                textCanvas.height = window.innerHeight;
                drawText(
                    CONFIG.text.messages[currentMessageIndex].text,
                    CONFIG.text.messages[currentMessageIndex].fontSize
                );
            });
        }

        // 启动程序
        init();
    </script>
</body>
</html>
